<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OASIS portal on a reflective floor</title>
  <desc id="desc">A luminous layered green portal stands at the horizon of a dark, reflective floor. Fine perspective lines and a soft reflection ground the symbol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070A08"/><stop offset="0.62" stop-color="#0B100C"/><stop offset="1" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B6FF83"/><stop offset="0.48" stop-color="#7CFF5E"/><stop offset="1" stop-color="#0ED168"/>
    </linearGradient>
    <linearGradient id="strata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7FF72"/><stop offset="1" stop-color="#20D878"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#39F17C" stop-opacity=".38"/><stop offset=".52" stop-color="#20C968" stop-opacity=".12"/><stop offset="1" stop-color="#20C968" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7FF72" stop-opacity=".58"/><stop offset=".45" stop-color="#32E07A" stop-opacity=".25"/><stop offset="1" stop-color="#32E07A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflectionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset=".58" stop-color="#FFFFFF" stop-opacity=".34"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="19"/></filter>
    <filter id="smallGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <mask id="reflectionMask"><rect x="0" y="444" width="1200" height="231" fill="url(#reflectionFade)"/></mask>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
