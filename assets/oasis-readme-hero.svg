    <text x="88" y="214" font-size="27" font-weight="600" fill="#E6F5EA">The open-source coding agent for any model.</text>
    <text x="88" y="252" font-size="19" fill="#E6F5EA" opacity=".72">Terminal and web app · Claude Code plugins · verified work</text>
    <text x="88" y="386" font-size="13" letter-spacing="5" fill="#E6F5EA" opacity=".75">CODE. AUTOMATE. <tspan fill="#7CFF5E" font-weight="700">FLOURISH.</tspan></text>
