    <text x="86" y="276" font-size="36" font-weight="700" fill="#F1FBF3">The open-source coding</text>
    <text x="86" y="320" font-size="36" font-weight="700" fill="#F1FBF3">agent for <tspan fill="#7CFF5E">any model.</tspan></text>
    <text x="86" y="364" font-size="18" fill="#C9D8CE">Terminal, web app, desktop and editors. Your Claude Code</text>
    <text x="86" y="390" font-size="18" fill="#C9D8CE">setup as is, and work that is actually checked.</text>
