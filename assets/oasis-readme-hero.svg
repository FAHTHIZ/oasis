  <title id="title">OASIS: the open-source coding agent for any model</title>
  <desc id="desc">The OASIS wordmark and tagline beside a terminal window where OASIS fixes a failing login test: it finds the bug, shows a one-line diff, runs npm test with 42 passing, and finishes with a checked summary. Fen, the pixel-art fennec fox mascot, peeks over the terminal.</desc>
