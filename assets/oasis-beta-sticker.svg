<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">OASIS is now in beta</title>
  <desc id="desc">A neon-lime and charcoal OASIS beta-stage sticker for the open-source, local-first AI coding agent.</desc>
