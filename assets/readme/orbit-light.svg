<title id="t">Every place OASIS runs, around one runtime</title>
<desc id="d">The OASIS portal mark in the centre with two orbits. Inner: Terminal, Web app, Desktop app, VS Code · Cursor, Zed · JetBrains, CI · GitHub Action. Outer: Telegram, Slack, Discord, WhatsApp, Matrix · Signal, Email, A2A agents, MCP clients, Codex clients, Node.js SDK, Cloud runs, Cursor API. Light travels from the centre to each one in turn.</desc>
