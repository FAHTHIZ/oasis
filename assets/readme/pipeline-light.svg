<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
<title id="t">How an OASIS task runs</title>
<desc id="d">Five steps: ask in plain words, read the repository, edit with checkpointed diffs, verify with tests and a diff review at the verification gate, and finish only with what it saw pass. A dashed arrow from Verify back to Edit shows that a failed check sends the agent back.</desc>
<defs><linearGradient id="trk" x1="0" x2="1"><stop offset="0" stop-color="#32E07A" stop-opacity=".15"/><stop offset=".5" stop-color="#7CFF5E"/><stop offset="1" stop-color="#0ED168" stop-opacity=".15"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0A7846"/></marker>
<filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.c0{animation:c0 10s ease-in-out infinite}
@keyframes c0{0%,4%{stroke:#D5E5DA}7%,18%{stroke:#18A957}22%,100%{stroke:#D5E5DA}}
.n0{animation:n0 10s ease-in-out infinite}
@keyframes n0{0%,4%{fill:#4A6352}7%,18%{fill:#0A7846}22%,100%{fill:#4A6352}}
.c1{animation:c1 10s ease-in-out infinite}
@keyframes c1{0%,19%{stroke:#D5E5DA}22%,33%{stroke:#18A957}37%,100%{stroke:#D5E5DA}}
.n1{animation:n1 10s ease-in-out infinite}
@keyframes n1{0%,19%{fill:#4A6352}22%,33%{fill:#0A7846}37%,100%{fill:#4A6352}}
.c2{animation:c2 10s ease-in-out infinite}
@keyframes c2{0%,34%{stroke:#D5E5DA}37%,48%{stroke:#18A957}52%,100%{stroke:#D5E5DA}}
.n2{animation:n2 10s ease-in-out infinite}
@keyframes n2{0%,34%{fill:#4A6352}37%,48%{fill:#0A7846}52%,100%{fill:#4A6352}}
.c3{animation:c3 10s ease-in-out infinite}
@keyframes c3{0%,49%{stroke:#D5E5DA}52%,63%{stroke:#0A7846}67%,100%{stroke:#D5E5DA}}
.n3{animation:n3 10s ease-in-out infinite}
@keyframes n3{0%,49%{fill:#4A6352}52%,63%{fill:#0A7846}67%,100%{fill:#4A6352}}
.c4{animation:c4 10s ease-in-out infinite}
@keyframes c4{0%,64%{stroke:#D5E5DA}67%,78%{stroke:#18A957}82%,100%{stroke:#D5E5DA}}
.n4{animation:n4 10s ease-in-out infinite}
@keyframes n4{0%,64%{fill:#4A6352}67%,78%{fill:#0A7846}82%,100%{fill:#4A6352}}
.pulse{animation:pulse 10s linear infinite}
@keyframes pulse{0%{transform:translateX(0);opacity:0}4%{opacity:1}76%{transform:translateX(992px);opacity:1}84%,100%{transform:translateX(992px);opacity:0}}
.retry{stroke-dasharray:6 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
}
</style>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <path d="M888 60 C 888 18, 640 18, 640 58" class="retry" fill="none" stroke="#0A7846" stroke-width="2" marker-end="url(#ah)" opacity=".8"/>
  <text x="764" y="24" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4A6352">check failed or skipped → back to work</text>
  <g><rect class="c0" x="40" y="70" width="208" height="132" rx="16" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="1.5"/>
  <text class="n0" x="60" y="102" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#4A6352">01</text>
  <text x="60" y="148" font-size="26" font-weight="800" fill="#0B1A10">Ask</text>
  <text x="60" y="176" font-size="14" fill="#4A6352">plain words, any model</text></g>
  <g><rect class="c1" x="288" y="70" width="208" height="132" rx="16" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="1.5"/>
  <text class="n1" x="308" y="102" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#4A6352">02</text>
  <text x="308" y="148" font-size="26" font-weight="800" fill="#0B1A10">Read</text>
  <text x="308" y="176" font-size="14" fill="#4A6352">repo map, search, files</text></g>
  <g><rect class="c2" x="536" y="70" width="208" height="132" rx="16" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="1.5"/>
  <text class="n2" x="556" y="102" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#4A6352">03</text>
  <text x="556" y="148" font-size="26" font-weight="800" fill="#0B1A10">Edit</text>
  <text x="556" y="176" font-size="14" fill="#4A6352">checkpointed diffs</text></g>
  <g><rect class="c3" x="784" y="70" width="208" height="132" rx="16" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="1.5"/>
  <text class="n3" x="804" y="102" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#4A6352">04</text><rect x="918" y="86" width="58" height="20" rx="10" fill="#E3FBE6"/><text x="947" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#0A7846">GATE</text>
  <text x="804" y="148" font-size="26" font-weight="800" fill="#0B1A10">Verify</text>
  <text x="804" y="176" font-size="14" fill="#4A6352">tests, diff review</text></g>
  <g><rect class="c4" x="1032" y="70" width="208" height="132" rx="16" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="1.5"/>
  <text class="n4" x="1052" y="102" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#4A6352">05</text>
  <text x="1052" y="148" font-size="26" font-weight="800" fill="#0B1A10">Done</text>
  <text x="1052" y="176" font-size="14" fill="#4A6352">only what it saw pass</text></g>
  <path d="M144 236 H1136" stroke="#D5E5DA" stroke-width="2" fill="none"/>
  <path d="M144 236 H1136" stroke="url(#trk)" stroke-width="2" fill="none" opacity=".7"/>
  <circle cx="144" cy="236" r="5" fill="#FFFFFF" stroke="#32E07A" stroke-width="2"/><circle cx="392" cy="236" r="5" fill="#FFFFFF" stroke="#32E07A" stroke-width="2"/><circle cx="640" cy="236" r="5" fill="#FFFFFF" stroke="#32E07A" stroke-width="2"/><circle cx="888" cy="236" r="5" fill="#FFFFFF" stroke="#32E07A" stroke-width="2"/><circle cx="1136" cy="236" r="5" fill="#FFFFFF" stroke="#32E07A" stroke-width="2"/>
  <g class="pulse"><circle cx="144" cy="236" r="9" fill="#18A957" filter="url(#g)"/><circle cx="144" cy="236" r="5" fill="#0A7846"/></g>
</g>
</svg>
