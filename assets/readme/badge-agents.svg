.ic{animation:ic 8s 5.199999999999999s ease-in-out infinite;transform-origin:21px 15px}
@keyframes ic{0%,100%{transform:scale(1)}6%{transform:scale(1.14)}12%{transform:scale(1)}}
}
</style>
<g clip-path="url(#agents-clip)">
<rect width="210" height="30" fill="url(#agents-bg)"/>
<rect x="94" y="3" width="113" height="24" rx="12" fill="url(#agents-val)"/>
<rect x="94.5" y="3.5" width="112" height="23" rx="11.5" fill="none" stroke="#32E07A" stroke-opacity=".22"/>
<rect class="sw" x="-60" y="0" width="46" height="30" fill="url(#agents-shine)" transform="translate(-70 0)"/>
</g>
<rect x=".5" y=".5" width="209" height="29" rx="14.5" fill="none" stroke="url(#agents-edge)"/>
<g class="ic"><g transform="translate(12 6) scale(.75)" fill="none" stroke="#7CFF5E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.5"/><path d="M2.5 20a5.5 5.5 0 0 1 11 0M13.5 19.5a4.5 4.5 0 0 1 8 0"/></g></g>
