<svg xmlns="http://www.w3.org/2000/svg" width="210" height="30" viewBox="0 0 210 30" role="img" aria-label="agents: parallel teams">
<title>agents: parallel teams</title>
<defs>
<linearGradient id="agents-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CFF5E" stop-opacity=".55"/><stop offset=".5" stop-color="#32E07A" stop-opacity=".18"/><stop offset="1" stop-color="#0ED168" stop-opacity=".5"/></linearGradient>
<linearGradient id="agents-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121A14"/><stop offset="1" stop-color="#0B0F0C"/></linearGradient>
<linearGradient id="agents-val" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243028"/><stop offset="1" stop-color="#1A1F1B"/></linearGradient>
<linearGradient id="agents-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="agents-clip"><rect width="210" height="30" rx="15"/></clipPath>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.sw{animation:sw 8s 5.199999999999999s cubic-bezier(.4,0,.2,1) infinite}
