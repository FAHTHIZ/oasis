<svg xmlns="http://www.w3.org/2000/svg" width="215" height="30" viewBox="0 0 215 30" role="img" aria-label="interface: desktop app">
<title>interface: desktop app</title>
<defs>
<linearGradient id="desktop-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CFF5E" stop-opacity=".55"/><stop offset=".5" stop-color="#32E07A" stop-opacity=".18"/><stop offset="1" stop-color="#0ED168" stop-opacity=".5"/></linearGradient>
<linearGradient id="desktop-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121A14"/><stop offset="1" stop-color="#0B0F0C"/></linearGradient>
<linearGradient id="desktop-val" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243028"/><stop offset="1" stop-color="#1A1F1B"/></linearGradient>
<linearGradient id="desktop-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="desktop-clip"><rect width="215" height="30" rx="15"/></clipPath>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.sw{animation:sw 8s 4.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sw{0%{transform:translateX(-70px)}18%,100%{transform:translateX(285px)}}
.ic{animation:ic 8s 4.4s ease-in-out infinite;transform-origin:21px 15px}
@keyframes ic{0%,100%{transform:scale(1)}6%{transform:scale(1.14)}12%{transform:scale(1)}}
}
</style>
<g clip-path="url(#desktop-clip)">
<rect width="215" height="30" fill="url(#desktop-bg)"/>
<rect x="112" y="3" width="100" height="24" rx="12" fill="url(#desktop-val)"/>
<rect x="112.5" y="3.5" width="99" height="23" rx="11.5" fill="none" stroke="#32E07A" stroke-opacity=".22"/>
<rect class="sw" x="-60" y="0" width="46" height="30" fill="url(#desktop-shine)" transform="translate(-70 0)"/>
</g>
<rect x=".5" y=".5" width="214" height="29" rx="14.5" fill="none" stroke="url(#desktop-edge)"/>
<g class="ic"><g transform="translate(12 6) scale(.75)" fill="none" stroke="#7CFF5E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 8.5h19M6 6.3h.01M9 6.3h.01"/></g></g>
<text x="38" y="18.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9DB5A5" textLength="64" lengthAdjust="spacingAndGlyphs">INTERFACE</text>
<text x="124" y="19.4" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6F5EA" textLength="76" lengthAdjust="spacingAndGlyphs">desktop app</text>
</svg>
