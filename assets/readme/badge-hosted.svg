.ic{animation:ic 8s 5.700000000000001s ease-in-out infinite;transform-origin:21px 15px}
@keyframes ic{0%,100%{transform:scale(1)}6%{transform:scale(1.14)}12%{transform:scale(1)}}
}
</style>
<g clip-path="url(#hosted-clip)">
<rect width="241" height="30" fill="url(#hosted-bg)"/>
<rect x="130" y="3" width="108" height="24" rx="12" fill="url(#hosted-val)"/>
<rect x="130.5" y="3.5" width="107" height="23" rx="11.5" fill="none" stroke="#32E07A" stroke-opacity=".22"/>
<rect class="sw" x="-60" y="0" width="46" height="30" fill="url(#hosted-shine)" transform="translate(-70 0)"/>
</g>
<rect x=".5" y=".5" width="240" height="29" rx="14.5" fill="none" stroke="url(#hosted-edge)"/>
