<text x="142" y="19.4" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6F5EA" textLength="84" lengthAdjust="spacingAndGlyphs">your machine</text>
