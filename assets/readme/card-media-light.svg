<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">MEDIA: Images and speech</title>
<desc id="d">On the left a generated picture of dunes under a sun is revealed from top to bottom by a scan line. On the right a waveform of bars moves as speech is generated, and a chip reads briefing.mp3 saved.</desc>
<defs><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A7846" stop-opacity=".45"/><stop offset=".45" stop-color="#D5E5DA"/><stop offset="1" stop-color="#D5E5DA"/></linearGradient>
<radialGradient id="spot" cx="0" cy="0" r="1"><stop offset="0" stop-color="#0A7846" stop-opacity=".07"/><stop offset="1" stop-color="#0A7846" stop-opacity="0"/></radialGradient></defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.cover{transform-box:fill-box;transform-origin:50% 100%;animation:cover 9s ease-in-out infinite}@keyframes cover{0%,5.56%{transform:scaleY(1)}35.56%,93.33%{transform:scaleY(0)}100%{transform:scaleY(1)}}
.scan{animation:scan 9s ease-in-out infinite}@keyframes scan{0%,5.56%{transform:translateY(0);opacity:1}35.56%{transform:translateY(180px);opacity:1}37.78%,100%{transform:translateY(180px);opacity:0}}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 1.1s ease-in-out infinite alternate}@keyframes wv{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.mp{animation:mp 9s linear infinite}
@keyframes mp{0%,42.22%{opacity:0;transform:translateY(5px)}46.11%,90%{opacity:1;transform:none}95.56%,100%{opacity:0;transform:none}}
.ig{animation:ig 9s linear infinite}
@keyframes ig{0%,37.78%{opacity:0;transform:translateY(5px)}41.67%,90%{opacity:1;transform:none}95.56%,100%{opacity:0;transform:none}}
}
</style>
