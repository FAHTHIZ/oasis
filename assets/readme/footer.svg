<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
<title id="t">Plan. Act. Verify.</title>
<desc id="d">A night desert under twinkling stars with a shooting star. The OASIS portal glows on the horizon and is reflected in the water below it. Fen the fennec fox sits on a dune at the left and blinks. The words Plan, Act, Verify light up in turn.</desc>
