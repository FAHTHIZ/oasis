  <g class="s2"><text x="560" y="150" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#7CFF5E">✓ opened</text></g></g>
