<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">RESEARCH: Cites only what it opened</title>
<desc id="d">A research question is typed. Three sources appear, each changes from fetching to opened with a check. A fourth citation that was never opened is flagged in amber.</desc>
