<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">BROWSER &amp; COMPUTER USE: Sees the screen, clicks</title>
<desc id="d">A window with a form. A cursor moves to the title field and clicks, the text Quarterly report is typed, the cursor clicks Save, the button turns green and reads Saved, and a chip reads screenshot checked.</desc>
<defs><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A7846" stop-opacity=".45"/><stop offset=".45" stop-color="#D5E5DA"/><stop offset="1" stop-color="#D5E5DA"/></linearGradient>
<radialGradient id="spot" cx="0" cy="0" r="1"><stop offset="0" stop-color="#0A7846" stop-opacity=".07"/><stop offset="1" stop-color="#0A7846" stop-opacity="0"/></radialGradient></defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.tf{animation:tf 10s infinite}
@keyframes tf{0%,23%{transform:translateX(0);opacity:1;animation-timing-function:steps(16,end)}32%,39%{transform:translateX(151px);opacity:1}39.5%,100%{transform:translateX(151px);opacity:0}}
.cur{animation:cur 10s infinite}@keyframes cur{0%,6%{transform:translate(500px,196px);animation-timing-function:cubic-bezier(.4,0,.2,1)}18%,34%{transform:translate(240px,104px);animation-timing-function:cubic-bezier(.4,0,.2,1)}44%,94%{transform:translate(486px,168px)}100%{transform:translate(500px,196px)}}
.rp1,.rp2{transform-box:fill-box;transform-origin:center}
.rp1{animation:rp1 10s ease-out infinite}@keyframes rp1{0%,19%{transform:scale(.3);opacity:0}20%{opacity:.8}26%,100%{transform:scale(2.2);opacity:0}}
.rp2{animation:rp2 10s ease-out infinite}@keyframes rp2{0%,45%{transform:scale(.3);opacity:0}46%{opacity:.8}52%,100%{transform:scale(2.2);opacity:0}}
.foc{animation:foc 10s linear infinite}@keyframes foc{0%,20%{stroke:#D5E5DA}21%,45%{stroke:#0A7846}46%,100%{stroke:#D5E5DA}}
.sv0{animation:sv0 10s linear infinite}
@keyframes sv0{0%,0%{opacity:0}2.5%,46%{opacity:1}48.5%,100%{opacity:0}}
.sv1{animation:sv1 10s linear infinite}
@keyframes sv1{0%,46%{opacity:0;transform:translateY(5px)}49.5%,91%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.shot{animation:shot 10s linear infinite}
