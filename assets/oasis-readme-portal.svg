<text x="466" y="226" font-family="Space Grotesk,Inter,DejaVu Sans,Arial,sans-serif" font-size="110" font-weight="450" letter-spacing="18" fill="url(#word)">OASIS</text>
<path d="M470 273H1088" stroke="#32E07A" stroke-width="2" opacity=".78"/>
<text x="470" y="353" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="650" letter-spacing="4.3" fill="#E6F5EA">CODE. AUTOMATE. <tspan fill="#7CFF5E">FLOURISH.</tspan></text>
<text x="473" y="397" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="18" fill="#AEBEB2">An open-source coding agent and local-first developer workspace.</text>
