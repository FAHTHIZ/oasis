<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">OASIS — Code. Automate. Flourish.</title>
<desc id="desc">The OASIS portal mark and wordmark in luminous green and soft white on a dark graphite background, with a subtle reflective grid.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050907"/><stop offset=".52" stop-color="#0B0F0C"/><stop offset="1" stop-color="#1A1F1B"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#32E07A" stop-opacity=".22"/><stop offset=".55" stop-color="#32E07A" stop-opacity=".07"/><stop offset="1" stop-color="#0B0F0C" stop-opacity="0"/></radialGradient>
  <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CFF5E"/><stop offset=".52" stop-color="#32E07A"/><stop offset="1" stop-color="#0ED168"/></linearGradient>
  <linearGradient id="strata" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CFF5E"/><stop offset="1" stop-color="#0ED168"/></linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4FBF5"/><stop offset="1" stop-color="#C8D8CD"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#7CFF5E" stroke-opacity=".075" stroke-width="1"/></pattern>
</defs>
