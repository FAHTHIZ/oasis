    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17251D"/>
      <stop offset="1" stop-color="#0B0F0C"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="554" height="164" rx="24" fill="url(#panel)" stroke="#9BFF55" stroke-width="2"/>
  <circle cx="78" cy="85" r="48" fill="#9BFF55" fill-opacity=".06" stroke="#9BFF55" stroke-opacity=".34" stroke-width="1.5"/>
