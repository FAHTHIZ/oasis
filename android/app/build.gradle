plugins {
    id 'com.android.application'
}

// Version comes from package.json so the app and the CLI never disagree.
def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def parts = pkg.version.tokenize('.-')
def code = (parts[0].toInteger() * 10000) + (parts[1].toInteger() * 100) + parts[2].toInteger()
def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.fahthiz.oasis'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fahthiz.oasis'
        minSdk 24
        targetSdk 35
        versionCode code * 1000 + (build % 1000)
        versionName pkg.version
    }

    signingConfigs {
        release {
            def store = System.getenv('OASIS_ANDROID_KEYSTORE')
            if (store) {
                storeFile file(store)
                storeType 'pkcs12'
                storePassword System.getenv('OASIS_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OASIS_ANDROID_KEY_ALIAS') ?: 'oasis'
                keyPassword System.getenv('OASIS_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('OASIS_ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The universal app is copied here by scripts/build-android.mjs.
    sourceSets { main { assets.srcDirs = ['build/web-assets'] } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.16.0'
}
