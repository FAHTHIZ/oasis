name: OASIS agent
description: Mention @oasis on an issue or pull request and OASIS can make a change, open a PR and reply in the thread using a configured model endpoint.
author: FAHTHIZ
branding:
  icon: terminal
  color: green
inputs:
  api_key:
    description: API key for the model provider (store it as a secret).
    required: false
  protocol:
    description: openai-responses, openai-compatible, or anthropic.
    required: false
  base_url:
    description: Provider base URL (for OpenAI-compatible providers, OpenRouter, Ollama on a self-hosted runner, ...).
    required: false
  model:
    description: Model ID.
    required: false
  prompt:
    description: Run this task directly instead of waiting for a mention (for workflow_dispatch or schedule).
    required: false
  branch:
    description: Push the changes to this branch (created if needed) instead of a new oasis/... branch. Used by `oasis cloud run`.
    required: false
  pull_request:
    description: Open a pull request for changes that are not on a pull request already (true or false).
    default: 'true'
  trigger_phrase:
    description: Phrase that triggers Oasis in comments, issues, and PRs.
    default: '@oasis'
  assignee_trigger:
    description: Also respond when an issue is assigned to this user.
    required: false
  label_trigger:
    description: Also respond when this label is added to an issue.
    required: false
  allowed_associations:
    description: Comma-separated author associations allowed to trigger Oasis.
    default: OWNER,MEMBER,COLLABORATOR
  permission_mode:
    description: Permission mode. auto lets a classifier approve routine actions and block risky ones.
    default: auto
  allowed_tools:
    description: Comma-separated permission rules to allow, e.g. "Bash(npm test:*),Bash(npm run lint:*)".
    required: false
  disallowed_tools:
    description: Comma-separated permission rules to deny.
    required: false
  max_turns:
    description: Maximum agent steps.
    default: '40'
  effort:
    description: Reasoning effort (low, medium, high, max).
    required: false
  append_system_prompt:
    description: Extra instructions for every run.
    required: false
  git_name:
    description: Commit author name. Defaults to the person who triggered the run (never a bot account).
    required: false
  git_email:
    description: Commit author email. Defaults to that person's GitHub noreply address.
    required: false
  receipt:
    description: Write a signed receipt of the run (evidence, claims, file digests, checks to replay), check it, report the verdict in the comment and upload it as the oasis-receipt artifact. Set to false to turn off.
    default: 'true'
  receipt_signing_key:
    description: Ed25519 private key (PEM) to sign receipts with, from a secret, so reviewers can pin its key id with --trust. Without it each run signs with a new key. Create one with `oasis receipt key --new`.
    required: false
  github_token:
    description: Token for comments, pushes, and pull requests.
    default: ${{ github.token }}
outputs:
  result:
    description: Oasis's final summary.
    value: ${{ steps.oasis.outputs.result }}
  branch:
    description: Branch that received the changes, if any.
    value: ${{ steps.oasis.outputs.branch }}
  pull_request:
    description: URL of the pull request Oasis opened, if any.
    value: ${{ steps.oasis.outputs.pull_request }}
  receipt:
    description: Path of the signed run receipt, if one was written.
    value: ${{ steps.oasis.outputs.receipt }}
  receipt_status:
    description: Verdict of checking the receipt (verified, drifted, unsupported, tampered, ...).
    value: ${{ steps.oasis.outputs.receipt_status }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - id: oasis
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/github-action.mjs"
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        OASIS_API_KEY: ${{ inputs.api_key }}
        OASIS_PROTOCOL: ${{ inputs.protocol }}
        OASIS_BASE_URL: ${{ inputs.base_url }}
        OASIS_MODEL: ${{ inputs.model }}
        OASIS_AUTO_MEMORY: '0'
        # Never launch language-server processes in unattended runs.
        OASIS_DISABLE_LSP: '1'
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_PULL_REQUEST: ${{ inputs.pull_request }}
        INPUT_TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        INPUT_ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        INPUT_LABEL_TRIGGER: ${{ inputs.label_trigger }}
        INPUT_ALLOWED_ASSOCIATIONS: ${{ inputs.allowed_associations }}
        INPUT_PERMISSION_MODE: ${{ inputs.permission_mode }}
        INPUT_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        INPUT_DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_EFFORT: ${{ inputs.effort }}
        INPUT_APPEND_SYSTEM_PROMPT: ${{ inputs.append_system_prompt }}
        INPUT_GIT_NAME: ${{ inputs.git_name }}
        INPUT_GIT_EMAIL: ${{ inputs.git_email }}
        INPUT_RECEIPT: ${{ inputs.receipt }}
        OASIS_RECEIPT_KEY: ${{ inputs.receipt_signing_key }}
    - if: always() && steps.oasis.outputs.receipt != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: oasis-receipt
        path: ${{ steps.oasis.outputs.receipt }}
        if-no-files-found: ignore
