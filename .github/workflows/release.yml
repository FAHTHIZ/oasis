name: Release OASIS

# Publishes the CLI + web workspace as an npm tarball, and the desktop app
# installers (Windows NSIS, macOS dmg, Linux AppImage and deb) built from the
# same runtime, on GitHub Releases when package.json carries a new stable
# version on main (or on manual dispatch), then refreshes the Homebrew formula.
# Every push to main builds and launch-tests the installers, so a broken
# desktop build is caught before any release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Enable the stable release publication job"
        required: true
        default: false
        type: boolean
      confirm_stable_release:
        description: "Confirm all manual release gates are complete and publish the current package version as stable"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: oasis-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and pack the release tarball
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies and vendor terminal assets
        run: npm ci --no-audit --no-fund
      - name: Run quick quality gate
        run: npm run check:quick
      - name: Pack npm tarball
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          ls -l release
      - name: Smoke-test the packed CLI
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          npm install --global --prefix "$prefix" --no-audit --no-fund "./$(ls release/*.tgz | head -1)"
          "$prefix/bin/oasis" --version
      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Build desktop app (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            target: --win nsis --x64
          - platform: macos-arm64
            os: macos-latest
            target: --mac dmg --arm64
          - platform: linux-x64
            os: ubuntu-latest
            target: --linux AppImage deb --x64
          # Extra CPU types. A failure here never blocks the release of the
          # main installers; it only leaves that file out.
          - platform: macos-x64
            os: macos-15-intel
            target: --mac dmg --x64
            optional: true
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: --linux AppImage deb --arm64
            optional: true
          - platform: windows-arm64
            os: windows-11-arm
            target: --win nsis --arm64
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the runtime (vendors terminal assets)
        run: npm ci --no-audit --no-fund
      - name: Install Electron and electron-builder
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Run the desktop unit tests
        run: node --test test/desktop-*.test.mjs test/web-desktop-host.test.mjs test/app-update.test.mjs
      - name: Build installers
        working-directory: desktop
        shell: bash
        env:
          # Optional signing secrets (docs/RELEASING.md). Without them macOS
          # builds are signed ad hoc and Windows builds are unsigned.
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MACOS_CERTIFICATE" ]; then
            # A base64 .p12 Developer ID Application certificate; notarized when APPLE_* are set.
            export CSC_LINK="$MACOS_CERTIFICATE" CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
            if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
            echo "Signing the macOS build with the Developer ID certificate."
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_CERTIFICATE" ]; then
            export WIN_CSC_LINK="$WINDOWS_CERTIFICATE" WIN_CSC_KEY_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"
            echo "Signing the Windows build with the code-signing certificate."
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          unset MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD
          node scripts/build.mjs ${{ matrix.target }}
      - name: Launch the packaged app and check its workspace answers
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
            xvfb-run -a node desktop/scripts/smoke.mjs
          else
            node desktop/scripts/smoke.mjs
          fi
      - name: Keep only user downloads
        shell: bash
        run: |
          set -euo pipefail
          cd release
          # Unpacked folders, block maps and electron-builder's logs are not downloads.
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          rm -f builder-debug.yml builder-effective-config.yaml *.blockmap latest*.yml
          ls -l
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish the explicitly approved OASIS release
    # Optional CPU types may fail without blocking (continue-on-error), but the
    # main Windows, macOS and Linux installers must build and launch.
    if: >-
      needs.package.result == 'success' &&
      needs.desktop.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.publish_release == true &&
        inputs.confirm_stable_release == true))
    needs: [package, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify version, release target, and curated notes
        id: release-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          release_channel="$(node -p "require('./package.json').oasisRelease?.channel || ''")"
          if [ "$release_channel" != "stable" ]; then
            echo "::error::Refusing to publish: package.json oasisRelease.channel must be stable, not '$release_channel'. Set it to stable only after the release gates pass."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF" = "refs/heads/main" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual release publication is allowed only from main."
              exit 1
            fi
            tag="$expected"
          else
            tag="$REF_NAME"
          fi
          if [ "$tag" != "$expected" ]; then
            echo "::error::Release tag $tag does not match package version $expected."
            exit 1
          fi
          refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          existing_sha="$(printf '%s\n' "$refs" | awk -v peeled="refs/tags/$tag^{}" -v raw="refs/tags/$tag" '
            $2 == peeled { print $1; found = 1; exit }
            $2 == raw { raw_sha = $1 }
            END { if (!found && raw_sha != "") print raw_sha }
          ')"
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$COMMIT_SHA" ]; then
            if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
              echo "::notice::Version $tag is already released from $existing_sha; this main commit will not overwrite it."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Tag $tag already points to $existing_sha, not $COMMIT_SHA."
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "release_name=OASIS $tag (Release Candidate)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "release_name=OASIS $tag" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - name: Require same-commit quality and installer gates
        if: steps.release-version.outputs.publish == 'true'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$TARGET_SHA" ]; then
            echo "::error::Release candidate is no longer the current main commit."
            exit 1
          fi
          for workflow in quality.yml installer-checks.yml; do
            echo "Waiting for $workflow to pass on $TARGET_SHA..."
            passed=false
            for attempt in $(seq 1 90); do
              response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$TARGET_SHA&per_page=20")"
              latest="$(printf '%s' "$response" | jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // {}')"
              status="$(printf '%s' "$latest" | jq -r '.status // "missing"')"
              conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::Required $workflow gate for $TARGET_SHA completed with $conclusion."
                  exit 1
                fi
                passed=true
                break
              fi
              if [ "$attempt" -lt 90 ]; then sleep 20; fi
            done
            if [ "$passed" != "true" ]; then
              echo "::error::Timed out waiting for $workflow to pass on $TARGET_SHA."
              exit 1
            fi
          done
      - name: Download the release tarball and desktop installers
        if: steps.release-version.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oasis-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums for release assets
        if: steps.release-version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
      - name: Publish GitHub release
        if: steps.release-version.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          name: ${{ steps.release-version.outputs.release_name }}
          target_commitish: ${{ steps.release-version.outputs.target_commitish }}
          generate_release_notes: true
          prerelease: ${{ steps.release-version.outputs.prerelease }}
          make_latest: ${{ steps.release-version.outputs.make_latest }}
          fail_on_unmatched_files: true
          draft: false
          files: release-assets/*
      - name: Set up Node.js for npm publishing
        if: steps.release-version.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish the tarball to npm (when NPM_TOKEN is set)
        # Publishes the exact tarball attached to the release, with provenance.
        # Skipped, with a notice, until the NPM_TOKEN secret exists.
        if: steps.release-version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.release-version.outputs.prerelease == 'true' && 'next' || 'latest' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; skipping npm publish. Add an npm automation token as the NPM_TOKEN secret to publish."
            exit 0
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm."
            exit 0
          fi
          tarball="$(ls release-assets/*.tgz | head -1)"
          npm publish "$tarball" --access public --provenance --tag "$NPM_TAG"
      - name: Refresh the Homebrew formula on main
        # Formula/oasis-cli.rb pins the tag's source tarball. Pushes made with
        # the workflow token do not start other workflows, so this cannot loop.
        # Stable releases only.
        if: steps.release-version.outputs.publish == 'true' && steps.release-version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          git clone --quiet --depth 20 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tap-main
          cd tap-main
          source_sha="$(curl -fsSL --retry 3 "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz" | sha256sum | cut -d' ' -f1)"
          node scripts/homebrew-formula.mjs --version "$RELEASE_VERSION" --source-sha "$source_sha"
          if git diff --quiet -- Formula/oasis-cli.rb; then echo "Homebrew formula already current."; exit 0; fi
          # Commit as the repository owner or the person who started the run, never a bot account.
          git_login="$GITHUB_ACTOR"; git_id="$GITHUB_ACTOR_ID"
          case "$git_login" in *"[bot]"|"") git_login="$GITHUB_REPOSITORY_OWNER"; git_id="$GITHUB_REPOSITORY_OWNER_ID";; esac
          git config user.name "$git_login"
          git config user.email "${git_id}+${git_login}@users.noreply.github.com"
          git add Formula/oasis-cli.rb
          git commit --quiet -m "Update Homebrew formula to OASIS $RELEASE_VERSION"
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:main; then exit 0; fi
            git pull --quiet --rebase origin main
          done
          echo "::warning::Could not push the Homebrew formula update; run node scripts/homebrew-formula.mjs --version $RELEASE_VERSION --source-sha <tarball sha256> and commit Formula/."
