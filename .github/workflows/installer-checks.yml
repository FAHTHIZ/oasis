name: Installer checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oasis-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-installer:
    name: Unix installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check installer syntax
        run: sh -n scripts/install.sh
      - name: Install pinned release and run doctor
        run: sh scripts/install.sh --yes --skip-setup
      - name: Check installed command version
        run: "$HOME/.local/bin/oasis --version"
      - name: Measure cold CLI startup
        run: node scripts/measure-startup.mjs
      - name: Check installed environment
        run: "$HOME/.local/bin/oasis doctor"

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test PowerShell release fallback parsing
        shell: pwsh
        run: ./test/installer-powershell-fallback.test.ps1
      - name: Install pinned release and run doctor
        shell: pwsh
        run: ./scripts/install.ps1 -Yes -SkipSetup
      - name: Check installed command version
        shell: pwsh
        run: '& "$env:LOCALAPPDATA/OASIS/oasis.cmd" --version'
      - name: Measure cold CLI startup
        shell: pwsh
        run: node scripts/measure-startup.mjs
      - name: Check installed environment
        shell: pwsh
        run: '& "$env:LOCALAPPDATA/OASIS/oasis.cmd" doctor'
