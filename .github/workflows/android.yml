name: Build OASIS for Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - 'src/app-server.mjs'
      - 'src/agent/**'
      - 'scripts/build-app.mjs'
      - 'scripts/build-android.mjs'
      - 'skills/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'android/**'
      - 'scripts/build-android.mjs'
      - '.github/workflows/android.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oasis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 8.14.3
      - name: Bundle the universal app into the APK
        run: |
          node scripts/build-app.mjs
          node scripts/build-android.mjs
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.OASIS_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oasis.p12"
            echo "OASIS_ANDROID_KEYSTORE=$RUNNER_TEMP/oasis.p12" >> "$GITHUB_ENV"
          else
            echo "No signing key available: building with the debug key."
          fi
      - name: Build the APK
        env:
          OASIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OASIS_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease
      - name: Name and checksum the APK
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk "dist-android/OASIS-$version-android.apk"
          cp "dist-android/OASIS-$version-android.apk" dist-android/OASIS-android.apk
          (cd dist-android && sha256sum ./*.apk | sed 's# \./# #' > SHA256SUMS-android)
          cat dist-android/SHA256SUMS-android
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-android
          path: dist-android/
          if-no-files-found: error
      - name: Publish the rolling Android download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          notes="OASIS for Android, built from main at ${GITHUB_SHA::7}. The whole universal app is inside the APK and works offline. Download OASIS-android.apk, open it, and allow installs from your browser or file manager when Android asks. Check it against SHA256SUMS-android."
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete android-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create android-latest dist-android/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "OASIS for Android (latest build, $VERSION)" --notes "$notes"
      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist-android/OASIS-*-android.apk dist-android/SHA256SUMS-android --repo "$GITHUB_REPOSITORY" --clobber
