name: Build OASIS desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Enable the stable release publication job"
        required: true
        default: false
        type: boolean
      confirm_stable_release:
        description: "Confirm all manual release gates are complete and publish v1.0.0 as stable"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Keep only the newest desktop build per ref to avoid an obsolete build backlog.
  group: oasis-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source on Linux before packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run complete quality gate
        run: npm run check

  package:
    name: Build desktop installer (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            command: win
          - platform: macos
            os: macos-latest
            command: mac
          - platform: linux-x64
            os: ubuntu-latest
            command: linux
          # Extra CPU types. They are optional: a failure here never blocks the
          # release of the main installers, it only leaves that file out.
          - platform: macos-x64
            os: macos-latest
            command: mac
            arch: x64
            optional: true
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            command: linux
            arch: arm64
            optional: true
          - platform: windows-arm64
            os: windows-11-arm
            command: win
            arch: arm64
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Visual Studio Build Tools
        if: matrix.command == 'win'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          # The Windows ARM runner image ships a newer Visual Studio than x64.
          vs-version: ${{ matrix.arch == 'arm64' && '[17.0,)' || '[17.0,18.0)' }}
      - name: Install app and packaging dependencies
        env:
          # The Windows ARM image ships only Visual Studio 2026 (version 18).
          GYP_MSVS_VERSION: ${{ matrix.command == 'win' && (matrix.arch == 'arm64' && '2026' || '2022') || '' }}
        run: npm install --no-audit --no-fund
      - name: Package Windows installer
        if: matrix.command == 'win'
        env:
          GYP_MSVS_VERSION: ${{ matrix.arch == 'arm64' && '2026' || '2022' }}
          npm_config_msvs_version: ${{ matrix.arch == 'arm64' && '2026' || '2022' }}
        run: npm run desktop:dist -- --win nsis ${{ matrix.arch && format('--{0}', matrix.arch) || '--x64' }}
      - name: Package macOS disk image
        if: matrix.command == 'mac'
        run: npm run desktop:dist -- --mac dmg ${{ matrix.arch && format('--{0}', matrix.arch) || '--arm64' }}
      - name: Package Linux installers
        if: matrix.command == 'linux'
        run: npm run desktop:dist -- --linux AppImage deb ${{ matrix.arch && format('--{0}', matrix.arch) || '--x64' }}
      - name: Drop updater metadata from extra CPU builds
        # latest*.yml names collide between CPU types; the main build's copy is kept.
        if: matrix.optional == true
        shell: bash
        run: rm -f release/latest*.yml
      - name: Upload platform installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish the explicitly approved OASIS release
    if: >-
      needs.package.result == 'success' &&
      needs.validate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.publish_release == true &&
        inputs.confirm_stable_release == true))
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # write: dispatch the homepage workflow after publishing (below).
      actions: write
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify version, release target, and curated notes
        id: release-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          release_channel="$(node -p "require('./package.json').oasisRelease?.channel || ''")"
          if [ "$release_channel" != "stable" ]; then
            echo "::error::Refusing to publish: package.json oasisRelease.channel must be stable, not '$release_channel'. Set it to stable only after the release gates pass."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF" = "refs/heads/main" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual release publication is allowed only from main."
              exit 1
            fi
            tag="$expected"
          else
            tag="$REF_NAME"
          fi
          if [ "$tag" != "$expected" ]; then
            echo "::error::Release tag $tag does not match package version $expected."
            exit 1
          fi
          notes_path="docs/releases/${tag}.md"
          if [ ! -f "$notes_path" ]; then
            echo "::error::Missing curated release notes: $notes_path."
            exit 1
          fi
          refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          existing_sha="$(printf '%s\n' "$refs" | awk -v peeled="refs/tags/$tag^{}" -v raw="refs/tags/$tag" '
            $2 == peeled { print $1; found = 1; exit }
            $2 == raw { raw_sha = $1 }
            END { if (!found && raw_sha != "") print raw_sha }
          ')"
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$COMMIT_SHA" ]; then
            if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
              echo "::notice::Version $tag is already released from $existing_sha; this main commit will not overwrite it."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Tag $tag already points to $existing_sha, not $COMMIT_SHA."
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "release_name=OASIS $tag (Release Candidate)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "release_name=OASIS $tag" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"
      - name: Require same-commit quality, site, and installer gates
        if: steps.release-version.outputs.publish == 'true'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$TARGET_SHA" ]; then
            echo "::error::Release candidate is no longer the current main commit."
            exit 1
          fi
          for workflow in quality.yml pages.yml installer-checks.yml; do
            echo "Waiting for $workflow to pass on $TARGET_SHA..."
            passed=false
            for attempt in $(seq 1 90); do
              response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$TARGET_SHA&per_page=20")"
              latest="$(printf '%s' "$response" | jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // {}')"
              status="$(printf '%s' "$latest" | jq -r '.status // "missing"')"
              conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::Required $workflow gate for $TARGET_SHA completed with $conclusion."
                  exit 1
                fi
                passed=true
                break
              fi
              if [ "$attempt" -lt 90 ]; then sleep 20; fi
            done
            if [ "$passed" != "true" ]; then
              echo "::error::Timed out waiting for $workflow to pass on $TARGET_SHA."
              exit 1
            fi
          done
      - name: Download all platform installers
        if: steps.release-version.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oasis-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums for release assets
        if: steps.release-version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          # electron-builder's internal build log is not a user download.
          rm -f builder-debug.yml builder-effective-config.yaml
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
      - name: Publish GitHub release
        if: steps.release-version.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          name: ${{ steps.release-version.outputs.release_name }}
          target_commitish: ${{ steps.release-version.outputs.target_commitish }}
          body_path: ${{ steps.release-version.outputs.notes_path }}
          generate_release_notes: false
          prerelease: ${{ steps.release-version.outputs.prerelease }}
          make_latest: ${{ steps.release-version.outputs.make_latest }}
          fail_on_unmatched_files: true
          draft: false
          files: release-assets/*
      - name: Refresh the homepage download links
        # Releases created with the workflow token do not trigger other workflows,
        # so ask the homepage workflow to restamp its download rows for this release.
        if: steps.release-version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh workflow run pages.yml --ref main || echo "::warning::Could not dispatch the homepage workflow; it will restamp on the next push to main."
      - name: Refresh the Homebrew cask on main
        # Casks/oasis.rb pins each release's dmg checksums and Formula/oasis-cli.rb
        # the tag's source tarball. Pushes made with the
        # workflow token do not start other workflows, so this cannot loop.
        # Stable releases only: release candidates keep the cask on the last stable.
        if: steps.release-version.outputs.publish == 'true' && steps.release-version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          git clone --quiet --depth 20 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cask-main
          cd cask-main
          # GitHub keeps tag archive checksums stable; the CLI formula pins this one.
          source_sha="$(curl -fsSL --retry 3 "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz" | sha256sum | cut -d' ' -f1)"
          node scripts/homebrew-cask.mjs --version "$RELEASE_VERSION" --sums ../release-assets/SHA256SUMS --source-sha "$source_sha"
          if git diff --quiet -- Casks/oasis.rb Formula/oasis-cli.rb && [ -z "$(git status --porcelain -- Formula)" ]; then echo "Homebrew tap already current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/oasis.rb Formula/oasis-cli.rb
          git commit --quiet -m "Update Homebrew tap to OASIS $RELEASE_VERSION"
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:main; then exit 0; fi
            git pull --quiet --rebase origin main
          done
          echo "::warning::Could not push the Homebrew tap update; run node scripts/homebrew-cask.mjs --version $RELEASE_VERSION --sums SHA256SUMS --source-sha <tarball sha256> and commit Casks/ and Formula/."
