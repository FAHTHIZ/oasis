name: Build OASIS desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep only the newest desktop build per ref to avoid an obsolete build backlog.
  group: oasis-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source on Linux before packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run complete quality gate
        run: npm run check

  package:
    name: Build desktop installer (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            command: win
          - platform: macos
            os: macos-latest
            command: mac
          - platform: linux-x64
            os: ubuntu-latest
            command: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Visual Studio Build Tools
        if: matrix.command == 'win'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Install app and packaging dependencies
        env:
          GYP_MSVS_VERSION: ${{ matrix.command == 'win' && '2022' || '' }}
        run: npm install --no-audit --no-fund
      - name: Package Windows installer
        if: matrix.command == 'win'
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: npm run desktop:dist -- --win nsis
      - name: Package macOS disk image
        if: matrix.command == 'mac'
        run: npm run desktop:dist -- --mac dmg
      - name: Package Linux installers
        if: matrix.command == 'linux'
        run: npm run desktop:dist -- --linux AppImage deb
      - name: Upload platform installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish a versioned release from an explicit version tag
    if: startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && needs.validate.result == 'success'
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches package version
        id: release-version
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "$expected" ]; then
            echo "::error::Release tag $TAG_NAME does not match package version $expected."
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oasis-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: release-assets/*
