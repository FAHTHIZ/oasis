name: Build OASIS desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oasis-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build desktop installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            command: win
          - platform: macos
            os: macos-latest
            command: mac
          - platform: linux-x64
            os: ubuntu-latest
            command: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app and packaging dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete automated tests
        run: npm test
      - name: Package Windows installer
        if: matrix.command == 'win'
        run: npm run desktop:dist -- --win nsis
      - name: Package macOS disk image
        if: matrix.command == 'mac'
        run: npm run desktop:dist -- --mac dmg
      - name: Package Linux installers
        if: matrix.command == 'linux'
        run: npm run desktop:dist -- --linux AppImage deb
      - name: Upload platform installer
        uses: actions/upload-artifact@v4
        with:
          name: oasis-desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish versioned installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: oasis-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          files: release-assets/*
