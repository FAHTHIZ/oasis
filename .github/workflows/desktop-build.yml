name: Build OASIS desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A later push must not replace this SHA's desktop-build evidence.
  group: oasis-desktop-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source on Linux before packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run complete quality gate
        run: npm run check

  package:
    name: Build desktop installer (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            command: win
          - platform: macos
            os: macos-latest
            command: mac
          - platform: linux-x64
            os: ubuntu-latest
            command: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Visual Studio Build Tools
        if: matrix.command == 'win'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      - name: Install app and packaging dependencies
        env:
          GYP_MSVS_VERSION: ${{ matrix.command == 'win' && '2022' || '' }}
        run: npm install --no-audit --no-fund
      - name: Package Windows installer
        if: matrix.command == 'win'
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: npm run desktop:dist -- --win nsis
      - name: Package macOS disk image
        if: matrix.command == 'mac'
        run: npm run desktop:dist -- --mac dmg
      - name: Package Linux installers
        if: matrix.command == 'linux'
        run: npm run desktop:dist -- --linux AppImage deb
      - name: Upload platform installer
        uses: actions/upload-artifact@v4
        with:
          name: oasis-desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish a versioned release once all platforms pass
    if: github.ref == 'refs/heads/main' && needs.package.result == 'success' && needs.validate.result == 'success'
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact build commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read package version
        id: release-version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: oasis-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Create version tag only if it is new
        id: release-tag
        env:
          TAG_NAME: ${{ steps.release-version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG_NAME already exists; existing release assets will not be overwritten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG_NAME"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        if: steps.release-tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: release-assets/*
