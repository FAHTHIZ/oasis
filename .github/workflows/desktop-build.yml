name: Build OASIS desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a fully verified Beta release from main"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Keep only the newest desktop build per ref to avoid an obsolete build backlog.
  group: oasis-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source on Linux before packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run complete quality gate
        run: npm run check

  package:
    name: Build desktop installer (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            command: win
          - platform: macos
            os: macos-latest
            command: mac
          - platform: linux-x64
            os: ubuntu-latest
            command: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Visual Studio Build Tools
        if: matrix.command == 'win'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Install app and packaging dependencies
        env:
          GYP_MSVS_VERSION: ${{ matrix.command == 'win' && '2022' || '' }}
        run: npm install --no-audit --no-fund
      - name: Package Windows installer
        if: matrix.command == 'win'
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: npm run desktop:dist -- --win nsis
      - name: Package macOS disk image
        if: matrix.command == 'mac'
        run: npm run desktop:dist -- --mac dmg
      - name: Package Linux installers
        if: matrix.command == 'linux'
        run: npm run desktop:dist -- --linux AppImage deb
      - name: Upload platform installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish the latest validated OASIS Beta release
    if: >-
      needs.package.result == 'success' &&
      needs.validate.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
      )
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify version, release target, and curated notes
        id: release-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual release publication is allowed only from main."
              exit 1
            fi
            tag="$expected"
          else
            tag="$REF_NAME"
          fi
          if [ "$tag" != "$expected" ]; then
            echo "::error::Release tag $tag does not match package version $expected."
            exit 1
          fi
          notes_path="docs/releases/${tag}.md"
          if [ ! -f "$notes_path" ]; then
            echo "::error::Missing curated release notes: $notes_path."
            exit 1
          fi
          refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          existing_sha="$(printf '%s\n' "$refs" | awk -v peeled="refs/tags/$tag^{}" -v raw="refs/tags/$tag" '
            $2 == peeled { print $1; found = 1; exit }
            $2 == raw { raw_sha = $1 }
            END { if (!found && raw_sha != "") print raw_sha }
          ')"
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$COMMIT_SHA" ]; then
            if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
              echo "::notice::Version $tag is already released from $existing_sha; this main commit will not overwrite it."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Tag $tag already points to $existing_sha, not $COMMIT_SHA."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"
      - name: Require same-commit quality, site, and installer gates
        if: steps.release-version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$TARGET_SHA" ]; then
            echo "::error::Release candidate is no longer the current main commit."
            exit 1
          fi
          for workflow in quality.yml pages.yml installer-checks.yml; do
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$TARGET_SHA&per_page=20")"
            latest="$(printf '%s' "$response" | jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // {}')"
            status="$(printf '%s' "$latest" | jq -r '.status // "missing"')"
            conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              echo "::error::Required $workflow gate for $TARGET_SHA is $status/$conclusion."
              exit 1
            fi
          done
      - name: Download all platform installers
        if: steps.release-version.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oasis-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums for release assets
        if: steps.release-version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
      - name: Publish GitHub release
        if: steps.release-version.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          name: OASIS ${{ steps.release-version.outputs.tag }} (Beta)
          target_commitish: ${{ steps.release-version.outputs.target_commitish }}
          body_path: ${{ steps.release-version.outputs.notes_path }}
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
          draft: false
          files: release-assets/*
