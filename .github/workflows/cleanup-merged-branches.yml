name: Clean merged and content-equivalent branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.repository == 'FAHTHIZ/oasis' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the cleanup policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify cleanup and file-hygiene safeguards
        run: node --test test/branch-cleanup.test.mjs test/installer-scripts.test.mjs test/repository-hygiene.test.mjs
      - name: Retire only verified merged or content-equivalent branches
        run: node scripts/cleanup-merged-branches.mjs --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
