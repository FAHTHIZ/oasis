name: Build and publish OASIS website and browser app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate refs so a PR cannot cancel main's publishing validation.
  # Superseded runs for the same ref are intentionally cancelled.
  group: oasis-public-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate browser app and distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run app, runtime, evaluation, and public-site checks
        run: npm run check
      - name: Verify installable CLI package contents
        run: npm pack --dry-run
      - name: Install pinned browser QA tools
        run: npm install --no-save --package-lock=false playwright@1.64.1 @axe-core/playwright@4.14.0
      - name: Install Chromium for public-site QA
        run: npx playwright install --with-deps chromium
      - name: Verify public website at desktop and phone sizes
        run: node .github/scripts/site-e2e.mjs

  publish:
    name: Publish browser app and repository metadata
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: configure-pages
      - name: Install runtime dependencies (the app's vendored browser packages)
        run: npm install --omit=dev --no-audit --no-fund
      - name: Build the installable universal browser app
        run: node scripts/build-app.mjs
      - name: Stamp the homepage with this commit
        env:
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/stamp-site.mjs
      - name: Upload public website and installable browser app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy installable browser app
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Check the optional repository admin secret
        id: launch-auth
        env:
          OASIS_REPO_ADMIN_TOKEN: ${{ secrets.OASIS_REPO_ADMIN_TOKEN }}
        shell: bash
        run: |
          if [ -n "$OASIS_REPO_ADMIN_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Update repository description and discovery topics
        id: apply-metadata
        if: ${{ steps.launch-auth.outputs.ready == 'true' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          OASIS_REPO_ADMIN_TOKEN: ${{ secrets.OASIS_REPO_ADMIN_TOKEN }}
        run: node .github/scripts/apply-repository-metadata.mjs
      - name: Write launch status
        if: always()
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          if [ "$DEPLOYMENT_OUTCOME" = "success" ]; then
            printf '## OASIS website and browser app deployed\n\n%s (commit %s)\n' "$DEPLOYED_URL" "${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## OASIS website and browser app deployment failed\n\nInspect the deploy step logs.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
