name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oasis-quality
  cancel-in-progress: true
jobs:
  integrity:
    name: Runtime tests and package integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser app and PWA assets
        run: node scripts/check-site.mjs
      - name: Run runtime and agent tests
        run: npm test
      - name: Verify installable CLI package contents
        run: npm pack --dry-run
