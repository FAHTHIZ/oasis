name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Let an active quality run finish so the branch badge always gets a real result.
  # GitHub keeps only the newest pending run for this group when more pushes arrive.
  group: oasis-quality-v15-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint:
    name: Lint (Oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Runs the version pinned in package.json without installing Electron.
      - name: Run Oxlint
        run: npm exec --yes --package="oxlint@$(node -p "require('./package.json').devDependencies.oxlint")" -- oxlint --deny-warnings

  integrity:
    name: Node ${{ matrix.node-version }} runtime and package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run full quality gate and validate eval fixtures
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/.github/scripts/test-resource-watch.mjs
        run: npm run check
      - name: Verify installable CLI package contents
        run: npm pack --dry-run
      - name: Generate current model-free harness benchmark report
        run: node bench/harness/run.mjs --json "$RUNNER_TEMP/oasis-harness-node-${{ matrix.node-version }}.json"
      - name: Smoke-check benchmark entrypoints without external provider access
        run: |
          node scripts/bench-live.mjs --help
          node scripts/bench-web-search.mjs --help
          node scripts/measure-startup.mjs --help
      - name: Upload model-free harness report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-harness-benchmark-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/oasis-harness-node-${{ matrix.node-version }}.json
          if-no-files-found: error
          retention-days: 90

  cross-platform-security:
    name: Security and runtime regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run portable security and filesystem regressions
        run: node --test test/permissions.test.mjs test/network-safety.test.mjs test/url-adversarial.test.mjs test/process-tree-cancel.test.mjs test/browser-navigation-e2e.test.mjs test/secure-store.test.mjs test/sandbox.test.mjs test/sandbox-enforcement.test.mjs test/app-control-guard.test.mjs test/auto-test.test.mjs test/test-tamper.test.mjs test/ai-comments.test.mjs test/cli-exec-alias.test.mjs test/protected-paths.test.mjs test/scratch.test.mjs
      - name: Verify portable global skill path regression
        run: node --test --test-name-pattern="portable project and global Agent Skills" test/runtime.test.mjs
  clean-environment-tests:
    name: Tests with a clean environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Install ast-grep (pinned) so the structural-search tests run
        run: npm install --prefix /tmp/ast-grep --no-audit --no-fund --no-save @ast-grep/cli@0.51.0
      - name: Install gitleaks (pinned, checksum verified) so the security_scan tests run
        # GitHub's release download host sometimes returns 504 for minutes. Try the
        # direct URL, then the release API through gh; if both fail, the real-gitleaks
        # tests skip with a warning instead of failing the whole job.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gitleaks && cd /tmp/gitleaks
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 180 -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            || gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --output gl.tgz --clobber \
            || { echo "::warning::gitleaks download failed; the real-gitleaks tests will be skipped"; exit 0; }
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Install zizmor and bandit (pinned) so the workflow and Python scanner tests run
        run: |
          python3 -m venv /tmp/pyscan
          /tmp/pyscan/bin/pip install --disable-pip-version-check -q zizmor==1.31.1 bandit==1.9.4
          mkdir -p /tmp/pyscan-bin && ln -s /tmp/pyscan/bin/zizmor /tmp/pyscan/bin/bandit /tmp/pyscan-bin/
      - name: Run tests without inherited environment variables
        run: mkdir -p /tmp/h1 && env -i PATH="/tmp/ast-grep/node_modules/.bin:/tmp/gitleaks:/tmp/pyscan-bin:$PATH" HOME=/tmp/h1 NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.github/scripts/test-resource-watch.mjs" node --test test/*.test.mjs

  pty-runtime:
    name: Native PTY integration (Linux / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install optional native PTY dependency
        run: npm install --omit=dev --no-audit --no-fund
      - name: Exercise a real interactive process
        run: node --test test/pty-sessions.test.mjs

  docker-sandbox:
    name: Live Docker sandbox isolation (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prove the container backend isolates a real workload
        env:
          OASIS_REQUIRE_DOCKER: '1'
        run: node --test test/sandbox-docker-live.test.mjs

  browser-e2e:
    name: Browser end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: integrity
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Install pinned Playwright, axe, and Chromium for CI only
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Run authenticated browser chat smoke test
        run: node .github/scripts/browser-e2e.mjs
      - name: Upload desktop and phone-width screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-browser-e2e-screenshots
          path: artifacts/browser-e2e/
          if-no-files-found: warn
          retention-days: 14
