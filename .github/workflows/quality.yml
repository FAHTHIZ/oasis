name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Let an active quality run finish so the branch badge always gets a real result.
  # GitHub keeps only the newest pending run for this group when more pushes arrive.
  group: oasis-quality-v6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrity:
    name: Node ${{ matrix.node-version }} runtime and package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run full quality gate and validate eval fixtures
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/.github/scripts/test-resource-watch.mjs
        run: npm run check
      - name: Verify installable CLI package contents
        run: npm pack --dry-run

  cross-platform-security:
    name: Security and runtime regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run portable security and filesystem regressions
        run: node --test test/permissions.test.mjs test/network-safety.test.mjs test/secure-store.test.mjs test/sandbox.test.mjs test/sandbox-enforcement.test.mjs
      - name: Verify portable global skill path regression
        run: node --test --test-name-pattern="portable project and global Agent Skills" test/runtime.test.mjs
  clean-environment-tests:
    name: Tests with a clean environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run tests without inherited environment variables
        run: mkdir -p /tmp/h1 && env -i PATH="$PATH" HOME=/tmp/h1 NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.github/scripts/test-resource-watch.mjs" node --test test/*.test.mjs

  pty-runtime:
    name: Native PTY integration (Linux / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install optional native PTY dependency
        run: npm install --omit=dev --no-audit --no-fund
      - name: Exercise a real interactive process
        run: node --test test/pty-sessions.test.mjs

  browser-e2e:
    name: Browser end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: integrity
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install production dependencies and vendor terminal assets
        run: npm install --omit=dev --no-audit --no-fund
      - name: Install pinned Playwright, axe, and Chromium for CI only
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Run authenticated browser chat smoke test
        run: node .github/scripts/browser-e2e.mjs
      - name: Upload desktop and phone-width screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasis-browser-e2e-screenshots
          path: artifacts/browser-e2e/
          if-no-files-found: warn
          retention-days: 14
