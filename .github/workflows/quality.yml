name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oasis-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    name: Node ${{ matrix.node-version }} runtime and package integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run full quality gate and validate eval fixtures
        run: npm run check
      - name: Verify installable CLI package contents
        run: npm pack --dry-run

  browser-e2e:
    name: Browser end-to-end smoke test
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright and Chromium for CI only
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run authenticated browser chat smoke test
        run: node scripts/browser-e2e.mjs
