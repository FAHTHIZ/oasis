blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/FAHTHIZ/oasis/security/advisories/new
    about: Report vulnerabilities privately. Please do not open a public issue for them.
  - name: Ask the community
    url: https://github.com/FAHTHIZ/oasis/discussions
    about: Questions, ideas and support in GitHub Discussions.
  - name: Download OASIS
    url: https://github.com/FAHTHIZ/oasis/releases
    about: Check whether a GitHub Release with desktop installers and SHA256SUMS has actually been published.
  - name: Install the browser app
    url: https://fahthiz.github.io/oasis/app/
    about: Open the installable browser app on desktop, phone or tablet.
