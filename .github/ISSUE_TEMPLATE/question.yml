name: Question
description: Ask for help using OASIS
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: "For general questions, GitHub Discussions is preferred when available."
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried, and what happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
    validations:
      required: false
