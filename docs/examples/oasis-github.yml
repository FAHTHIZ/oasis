# Copy to .github/workflows/oasis.yml in your repository.
# Add your provider key as a repository secret named OASIS_API_KEY.
name: Oasis
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  oasis:
    if: contains(github.event.comment.body || github.event.issue.body || '', '@oasis') || github.event.action == 'assigned' || github.event.action == 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gtxnrg-ship-it/oasis@main
        with:
          api_key: ${{ secrets.OASIS_API_KEY }}
          protocol: anthropic            # or openai-responses / openai-compatible
          model: claude-sonnet-5         # any model your provider offers
          allowed_tools: Bash(npm test:*),Bash(npm run lint:*)
